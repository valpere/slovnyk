name: slovnyk-local-dev

services:
  db:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slovnyk_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-slovnyk_dev}
    ports:
      - target: 5432
        published: "${SLOVNYK_DEV_DB_PORT-55432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1

volumes:
  postgres-data:
