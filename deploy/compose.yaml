name: slovnyk-production
services:
  db:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: slovnyk_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new bootstrap password in the private postgres.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, config_file=/etc/postgresql/slovnyk.conf]
    ports:
      - target: 5432
        published: "55432"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/slovnyk/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ./postgresql.conf
        target: /etc/postgresql/slovnyk.conf
        read_only: true
        bind:
          create_host_path: false
    shm_size: 1g
    mem_limit: 8g
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
