# Include inside nginx http {}. Certificate must cover both domains.
# No URLs, queries, referers, cookies or client identifiers in request logs.
log_format slovnyk_metrics '$time_iso8601 $status $request_time $upstream_status $upstream_response_time $bytes_sent';

server {
    listen 80;
    server_name slovnyk.org slovnyk.org.ua;
    access_log /var/log/nginx/slovnyk-metrics.log slovnyk_metrics;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/slovnyk-acme; }
    location / { return 308 https://slovnyk.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name slovnyk.org slovnyk.org.ua;
    ssl_certificate /etc/letsencrypt/live/slovnyk.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slovnyk.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/slovnyk-metrics.log slovnyk_metrics;
    # nginx request error logs can contain query text; use safe metrics + app events.
    error_log /dev/null;
    client_max_body_size 1k;
    large_client_header_buffers 4 64k;
    location = /healthz { return 404; }
    location = /readyz { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
