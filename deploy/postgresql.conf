# Starting profile; measure on the selected host before opening traffic.
listen_addresses = '*'
max_connections = 32
shared_buffers = '1GB'
work_mem = '16MB'
maintenance_work_mem = '512MB'
max_parallel_workers_per_gather = 0
max_wal_size = '2GB'
min_wal_size = '512MB'
# Per backend, not a total disk cap. Restore/index work may need an explicit override.
temp_file_limit = '1GB'
password_encryption = 'scram-sha-256'
# SQL/errors can contain dictionary text. Keep fatal startup/connection diagnostics only.
log_statement = 'none'
log_min_messages = 'fatal'
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
log_duration = off
log_min_duration_statement = -1
log_connections = off
log_disconnections = off
log_temp_files = -1
